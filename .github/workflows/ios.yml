name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Validate both package manifests
        run: |
          swift package dump-package
          swift package --package-path ios dump-package

      - name: Test root Swift package on iOS Simulator
        run: xcodebuild test -scheme ARYPush -destination 'platform=iOS Simulator,name=iPhone 15' -skipPackagePluginValidation

      - name: Validate the CocoaPods spec
        working-directory: ios
        run: pod lib lint ARYPush.podspec --allow-warnings --skip-tests --no-clean
