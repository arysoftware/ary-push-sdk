name: Flutter

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - 'android/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - 'android/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Verify formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      # The examples declare the published GitHub package, which is what a real application
      # writes. CI overrides that to the working tree, so a breaking SDK change fails here
      # rather than silently after it has been tagged.
      - name: Analyze the examples against the working tree
        run: |
          for example in flutter/example flutter/example-firebase; do
            {
              echo "dependency_overrides:"
              echo "  ary_push:"
              echo "    path: ../"
            } > "$example/pubspec_overrides.yaml"
            (cd "$example" && flutter pub get && flutter analyze)
          done

  build-android:
    name: Build the example for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Both the Dart package and the native SDK are pointed at the working tree, so this job
      # proves the bridge still compiles against SDK source rather than against a published tag.
      - name: Point the example at the working tree
        run: |
          {
            echo "dependency_overrides:"
            echo "  ary_push:"
            echo "    path: ../"
          } > flutter/example/pubspec_overrides.yaml
          {
            echo ""
            echo 'include(":ary-push-sdk")'
            echo 'project(":ary-push-sdk").projectDir = file("../../../android/sdk")'
          } >> flutter/example/android/settings.gradle.kts

      - name: Build
        working-directory: flutter/example
        run: |
          flutter pub get
          flutter build apk --debug

  build-ios:
    name: Build the example for iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Overridden to the working tree for the same reason as the Android job: the point is to
      # catch a broken bridge or podspec before it is tagged, not after.
      - name: Point the example at the working tree
        run: |
          {
            echo "dependency_overrides:"
            echo "  ary_push:"
            echo "    path: ../"
          } > flutter/example/pubspec_overrides.yaml

      # --no-codesign: CI has no signing identity, and compilation is what is being verified.
      # The plugin's podspec copies the Swift SDK into its own pod, so no pod repository and no
      # Podfile entry are needed.
      - name: Build
        working-directory: flutter/example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
