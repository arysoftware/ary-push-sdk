// Flutter plugin module for the ARY Push SDK.
//
// A bridge, not an implementation: it forwards to the native Android SDK, which it compiles in.
//
// Written in Groovy, and applying its plugins with `apply plugin:` rather than a `plugins {}`
// block, on purpose. A versionless `plugins { id("com.android.library") }` only resolves when
// the *application's* settings.gradle declares that exact plugin id, and a plugin cannot
// require that of every application that consumes it. `apply plugin:` resolves from this
// module's own buildscript classpath, which is under our control.

buildscript {
    // Defaults match what `flutter create` generates on Flutter 3.44. An application on an
    // older Flutter can override both from its android/gradle.properties rather than forking
    // this plugin:
    //
    //     aryPushAgpVersion=8.7.3
    //     aryPushKotlinVersion=2.1.0
    //
    ext.aryAgpVersion = project.findProperty('aryPushAgpVersion') ?: '9.0.1'
    ext.aryKotlinVersion = project.findProperty('aryPushKotlinVersion') ?: '2.3.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$aryAgpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$aryKotlinVersion"
    }
}

apply plugin: 'com.android.library'

// AGP 9 compiles Kotlin itself and treats the standalone Kotlin plugin applied on top as a hard
// error. An application that sets android.builtInKotlin=false still needs it, and so does anyone
// on AGP 8. So the decision is made from what AGP actually registered, not from a version number
// we would have to keep in step with the host application's.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

group = 'com.ary.push.flutter'
version = '1.1.0'

// ---------------------------------------------------------------- where the SDK comes from

// The native SDK is compiled into this plugin from source, the same way the iOS pod vendors the
// Swift SDK. `flutter pub get` checks out the whole repository, so ../../android/sdk is the
// Android SDK from the very same commit as this bridge, in the pub cache and in a working tree
// alike: the two halves cannot disagree, and no artifact has to be built or downloaded.
//
// Fetching a prebuilt artifact from JitPack instead failed in two ways: the artifact could be
// older than the plugin (an unresolved reference to anything the plugin newly called), and
// JitPack's own build image could not run Gradle at all, which left every new commit without an
// Android SDK.
//
// A prebuilt artifact is still available, and wins whenever it is asked for explicitly, from the
// application's android/gradle.properties:
//
//     arySdkCoordinate=com.github.arysoftware:ary-push-sdk:<tag or commit>
//     arySdkCoordinate=com.ary:ary-push:1.1.0
//
// A local SDK module included by the host build (`:ary-push-sdk`) wins over both.
def localSdkProject = rootProject.findProject(':ary-push-sdk')
def arySdkCoordinate = project.findProperty('arySdkCoordinate')
def arySdkSource = file('../../android/sdk')
def bundleSdkSource = localSdkProject == null && arySdkCoordinate == null &&
    new File(arySdkSource, 'src/main/kotlin').isDirectory()

// The version the SDK reports about itself: registrations and the X-SDK-Version header.
def arySdkVersion = {
    def properties = new Properties()
    def file = file('../../android/gradle.properties')
    if (file.isFile()) file.withInputStream { properties.load(it) }
    properties.getProperty('aryPush.sdkVersion', version)
}()

if (localSdkProject != null) {
    logger.lifecycle("ARY Push SDK: native SDK from ${localSdkProject.path}")
} else if (bundleSdkSource) {
    logger.lifecycle("ARY Push SDK: native SDK ${arySdkVersion} compiled from ${arySdkSource}")
} else {
    arySdkCoordinate = arySdkCoordinate ?: 'com.github.arysoftware:ary-push-sdk:main-SNAPSHOT'
    logger.lifecycle("ARY Push SDK: native SDK ${arySdkCoordinate}")
}

// Only an artifact needs a repository. Credentials are optional: JitPack serves this public
// repository without any.
def aryMavenUrl = project.findProperty('aryMavenUrl') ?: System.getenv('ARY_MAVEN_URL')
def aryMavenUser = project.findProperty('aryMavenUser') ?: System.getenv('ARY_MAVEN_USER')
def aryMavenPassword = project.findProperty('aryMavenPassword') ?: System.getenv('ARY_MAVEN_PASSWORD')

repositories {
    google()
    mavenCentral()
}

// Declared on every project in the build, not just this one: Gradle resolves the dependency
// graph with the repositories of the project that owns the resolution -- the application module
// -- so a repository declared only here would never be consulted for the SDK coordinate.
if (!bundleSdkSource && localSdkProject == null) {
    def aryPushLocalRepo = project.hasProperty('aryPushLocalRepo')
        ? file(project.property('aryPushLocalRepo'))
        : file('../../android/build/local-maven')
    rootProject.allprojects { proj ->
        proj.repositories {
            maven {
                name = 'aryJitpack'
                url = 'https://jitpack.io'
            }
            if (aryMavenUrl) {
                maven {
                    url = aryMavenUrl
                    credentials {
                        username = aryMavenUser
                        password = aryMavenPassword
                    }
                }
            }
            if (aryPushLocalRepo.isDirectory()) {
                maven { url = aryPushLocalRepo }
            }
        }
    }
}

// ---------------------------------------------------------------- module

android {
    // The SDK's source refers to com.ary.push.R and com.ary.push.BuildConfig, which a module
    // generates from its namespace, so a module compiling that source takes the SDK's namespace.
    // The plugin's own classes keep their package; nothing of the plugin is generated.
    namespace bundleSdkSource ? 'com.ary.push' : 'com.ary.push.flutter'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        if (bundleSdkSource) {
            main.java.srcDirs += new File(arySdkSource, 'src/main/kotlin')
            main.res.srcDirs += new File(arySdkSource, 'src/main/res')
            // The SDK's manifest declares its messaging service, broadcast receiver, click
            // trampoline, permission host, startup provider and permissions. This module's own
            // manifest is empty, so the SDK's takes its place rather than being duplicated.
            main.manifest.srcFile new File(arySdkSource, 'src/main/AndroidManifest.xml')
        }
    }

    defaultConfig {
        // Flutter's own floor. The native SDK supports API 21, so a native Android application
        // consuming com.ary:ary-push directly is not constrained by this number.
        minSdk 24

        if (bundleSdkSource) {
            buildConfigField 'String', 'SDK_VERSION', "\"${arySdkVersion}\""
            consumerProguardFiles new File(arySdkSource, 'consumer-rules.pro')
        }
    }

    buildFeatures {
        buildConfig bundleSdkSource
    }
}

// Kotlin's JVM target must match compileOptions above, or the Kotlin compiler refuses the build.
// Both the standalone plugin and AGP's built-in Kotlin expose a `kotlin` extension, but the
// shape differs between them and between versions, so this is best-effort: if it cannot be set
// here, AGP has already aligned it with compileOptions and there is nothing to do.
def aryKotlinExtension = project.extensions.findByName('kotlin')
if (aryKotlinExtension != null) {
    try {
        aryKotlinExtension.compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    } catch (Exception ignored) {
        logger.info('ARY Push SDK: leaving the Kotlin JVM target to AGP')
    }
}

dependencies {
    if (localSdkProject != null) {
        implementation localSdkProject
    } else if (bundleSdkSource) {
        // The SDK's own dependencies, identical to android/sdk/build.gradle.kts. Change them
        // together.
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
        implementation 'androidx.core:core-ktx:1.13.1'
        implementation 'androidx.annotation:annotation:1.8.0'
        implementation 'androidx.startup:startup-runtime:1.1.1'
        implementation 'com.google.firebase:firebase-messaging:24.0.0'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    } else {
        implementation arySdkCoordinate
    }
}
