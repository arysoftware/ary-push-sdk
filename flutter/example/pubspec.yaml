name: ary_push_example
description: Minimal Flutter host application for the ARY Push SDK.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The published SDK, fetched from GitHub, exactly as a real application consumes it.
  #
  # While working ON the SDK, create a pubspec_overrides.yaml beside this file:
  #
  #     dependency_overrides:
  #       ary_push:
  #         path: ../
  #
  # That is what CI does, so a change is exercised against the working tree before it is ever
  # published. pubspec_overrides.yaml is git-ignored and never ships.
  # Never put a token in this URL. pubspec.yaml is committed, so a token written here is
  # published the moment the repository is pushed. Authenticate git instead, once, with either
  # of these — both keep the credential out of the repository:
  #
  #     gh auth login                     # GitHub CLI, stores the token in the OS keychain
  #     git config --global credential.helper manager   # Windows Credential Manager
  #
  # Add `ref: v1.0.0` below once that tag exists, to pin the example to a release.
  ary_push:
    git:
      url: https://github.com/arysoftware/ary-push-sdk.git
      path: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
