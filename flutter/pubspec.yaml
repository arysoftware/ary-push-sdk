name: ary_push
description: >-
  Private ARY push notification SDK for Flutter. A thin bridge over the native Android and
  iOS ARY Push SDKs.
version: 1.0.0
homepage: https://github.com/arysoftware/ary-push-sdk
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ary.push.flutter
        pluginClass: ARYPushPlugin
      ios:
        pluginClass: ARYPushPlugin
