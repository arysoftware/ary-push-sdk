name: ary_push_example_firebase
description: >-
  Flutter host application that already uses firebase_core and firebase_messaging, showing that
  the ARY Push SDK coexists with them rather than replacing them.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ary_push:
    path: ../
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
