name: ary_push_example_firebase
description: >-
  Flutter host application that already uses firebase_core and firebase_messaging, showing that
  the ARY Push SDK coexists with them rather than replacing them.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The published SDK, fetched from GitHub, exactly as a real application consumes it.
  #
  # While working ON the SDK, create a pubspec_overrides.yaml beside this file:
  #
  #     dependency_overrides:
  #       ary_push:
  #         path: ../
  #
  # That is what CI does, so a change is exercised against the working tree before it is ever
  # published. pubspec_overrides.yaml is git-ignored and never ships.
  # Never put a token in this URL: pubspec.yaml is committed, so a token written here ships with
  # the repository. Authenticate git once instead (`gh auth login`, or
  # `git config --global credential.helper manager`).
  #
  # Add `ref: v1.0.0` below once that tag exists, to pin the example to a release.
  ary_push:
    git:
      url: https://github.com/arysoftware/ary-push-sdk.git
      path: flutter
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
