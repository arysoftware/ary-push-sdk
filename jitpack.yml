# JitPack build configuration.
#
# JitPack looks for a build at the repository root, but this is a monorepo whose Android build
# lives in android/. So the install step is explicit: build the SDK and install it into the
# local Maven repository, which is where JitPack collects artifacts from.
#
# JitPack is how applications get this SDK. The repository is public, so JitPack builds it for
# free, on demand, from a git tag, and a consuming application needs no token and no account.
#
# JitPack serves everything under com.github.<owner>, and uses the tag verbatim as the Maven
# version, so the artifact a consuming project asks for is:
#
#     com.github.arysoftware:ary-push-sdk:v1.0.0
#
# android/gradle.properties already defaults to those coordinates, so a local build produces the
# same artifact name. Publishing to a self-hosted repository instead uses com.ary:ary-push via
# -ParyPush.group / -ParyPush.artifact. Same AAR, two names.

jdk:
  - openjdk21

# One command, not a `cd` followed by a build: whether each list entry runs in its own shell is
# not something to depend on, and a `cd` that silently did not carry would build the wrong
# directory.
#
# chmod first because this repository is developed on Windows, where git records no executable
# bit unless it is set explicitly. The bit is committed, and this makes the build survive losing
# it again — a lost bit fails here as "./gradlew: Permission denied", exit 126, which reads like
# a JitPack problem rather than a file mode.
install:
  - cd android && chmod +x ./gradlew && ./gradlew --no-daemon :sdk:publishReleasePublicationToMavenLocal
      -ParyPush.group=com.github.arysoftware
      -ParyPush.artifact=ary-push-sdk
      -ParyPush.version=$VERSION
