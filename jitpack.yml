# JitPack build configuration.
#
# JitPack looks for a build at the repository root, but this is a monorepo whose Android build
# lives in android/. So the install step is explicit: build the SDK and install it into the
# local Maven repository, which is where JitPack collects artifacts from.
#
# JitPack is how applications get this SDK. The repository is public, so JitPack builds it for
# free, on demand, and a consuming application needs no token and no account.
#
# JitPack serves everything under com.github.<owner>, and the Maven version is a git reference,
# so a consuming project asks for any of:
#
#     com.github.arysoftware:ary-push-sdk:main-SNAPSHOT   the tip of main, the default
#     com.github.arysoftware:ary-push-sdk:v1.0.0          a tag, pinned
#     com.github.arysoftware:ary-push-sdk:9b152ce         a commit, pinned
#
# android/gradle.properties defaults to the first, so a local build produces the same artifact
# name. Publishing to a self-hosted repository instead uses com.ary:ary-push via
# -ParyPush.group / -ParyPush.artifact. Same AAR, two names.

jdk:
  - openjdk21

# One command, not a `cd` followed by a build: whether each list entry runs in its own shell is
# not something to depend on, and a `cd` that silently did not carry would build the wrong
# directory.
#
# Gradle itself, not ./gradlew. JitPack's "latest" build image cannot load the wrapper's
# gradle-wrapper.jar ("Could not find or load main class org.gradle.wrapper.GradleWrapperMain")
# although the jar is committed and intact, while its "default" image can, and JitPack chooses
# the image per build. So the build installs the exact Gradle version the wrapper names, read
# from gradle-wrapper.properties so the two never drift, through the SDKMAN JitPack already uses
# to install the JDK, and runs it directly. That works on either image.
install:
  - source "$HOME/.sdkman/bin/sdkman-init.sh"
      && GRADLE_VERSION=$(sed -nE 's#.*gradle-([0-9.]+)-(bin|all)\.zip.*#\1#p' android/gradle/wrapper/gradle-wrapper.properties)
      && sdk install gradle "$GRADLE_VERSION" < /dev/null
      && sdk use gradle "$GRADLE_VERSION"
      && cd android
      && gradle --no-daemon :sdk:publishReleasePublicationToMavenLocal
      -ParyPush.group=com.github.arysoftware
      -ParyPush.artifact=ary-push-sdk
      -ParyPush.version=$VERSION
