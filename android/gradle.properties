org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# ARY Push SDK coordinates.
# Override on CI with -ParyPush.version=... or in ~/.gradle/gradle.properties.
# ---------------------------------------------------------------------------
aryPush.group=com.ary
aryPush.artifact=ary-push
aryPush.version=1.0.0

# Private Maven repository used by `./gradlew :sdk:publish`.
# Never commit real credentials. Supply them via ~/.gradle/gradle.properties or CI secrets:
#   aryMavenUrl=https://maven.ary.internal/releases
#   aryMavenUser=...
#   aryMavenPassword=...

# AGP 9 flags, matching what `flutter create` generates so the SDK build and a Flutter host
# application agree on the toolchain.
android.newDsl=false
android.builtInKotlin=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
