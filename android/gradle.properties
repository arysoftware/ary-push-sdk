org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# ARY Push SDK coordinates.
#
# These are JitPack's naming, because JitPack is how applications get the SDK: it serves
# everything under com.github.<owner>. Publishing locally with the same coordinates means the
# samples resolve the same artifact name whether it came from JitPack or from a local build.
#
# The version tracks the default branch rather than a release, so there is no number to keep in
# step across the samples, the Flutter plugin and this file. JitPack rebuilds main-SNAPSHOT when
# the branch moves, and Gradle re-checks any -SNAPSHOT version instead of caching it forever.
#
# Pin a release when you want one — that is what a production application should do:
#     -ParyPush.version=v1.0.0
#
# Publishing to a self-hosted Maven repository instead? Override the whole coordinate:
#     -ParyPush.group=com.ary -ParyPush.artifact=ary-push -ParyPush.version=1.0.0
# ---------------------------------------------------------------------------
aryPush.group=com.github.arysoftware
aryPush.artifact=ary-push-sdk
aryPush.version=main-SNAPSHOT

# Optional self-hosted Maven repository used by `./gradlew :sdk:publish`. Not needed to consume
# the SDK — JitPack serves it without credentials. Never commit real values; supply them via
# ~/.gradle/gradle.properties or CI secrets:
#   aryMavenUrl=https://maven.ary.internal/releases
#   aryMavenUser=...
#   aryMavenPassword=...

# AGP 9 flags, matching what `flutter create` generates so the SDK build and a Flutter host
# application agree on the toolchain.
android.newDsl=false
android.builtInKotlin=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
